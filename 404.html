<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません — エージェントベストジョブ転職</title>
<!-- GitHub Pages が存在しないURLすべてに返すページ（ステータスは404のまま）。どの階層のURLでも開かれるので、
     画像・リンクは必ず / から始まる絶対パスで書く。
     /job/<求人ID>/ で来たときは data/closed-jobs.json（static-pages.js の recordClosedJobs が作る）から
     掲載終了した求人の職種名・企業を引き、「この求人の掲載は終了しました」と企業ページへの導線を出す。 -->
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1XXMP8Y1B4"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-1XXMP8Y1B4');
</script>
<style>
  :root{
    --paper:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF1F6;
    --ink:#161A26; --ink-2:#4A5261; --ink-3:#6E7686;
    --line:#DDE2EA; --line-2:#EAEEF4;
    --accent:#1E3A8A; --accent-strong:#2A4CAE; --accent-soft:#E9EDF9;
    --red:#D2452B;
    --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP",Meiryo,system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0F131A; --surface:#171C26; --surface-2:#1F2530;
      --ink:#EAEEF5; --ink-2:#B4BCCA; --ink-3:#828C9E;
      --line:#2A313D; --line-2:#232A35;
      --accent:#8FA6F0; --accent-strong:#AFC0F8; --accent-soft:#1B2338;
      --red:#F07A62;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.85; -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1;
  }
  a{color:var(--accent)}
  .topbar{border-bottom:1px solid var(--line); background:var(--surface)}
  .topbar__inner{max-width:820px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px}
  .topbar__inner strong a{font-size:15px; color:var(--ink); text-decoration:none}
  .topbar__inner > a{font-size:13px; text-decoration:none}
  main{max-width:820px; margin:0 auto; padding:40px 24px 80px}
  .code{font-size:12.5px; font-weight:700; color:var(--ink-3); letter-spacing:.08em; margin:0 0 6px}
  h1{font-size:clamp(1.35rem,3vw,1.7rem); font-weight:800; margin:0 0 12px; letter-spacing:.01em}
  p{margin:0 0 12px; color:var(--ink-2)}
  .closed{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--red); border-radius:12px; padding:16px 20px; margin:20px 0 24px}
  .closed__label{font-size:12px; font-weight:700; color:var(--red); margin:0 0 4px}
  .closed__title{font-size:16px; font-weight:800; color:var(--ink); margin:0 0 2px; overflow-wrap:anywhere}
  .closed__co{font-size:14px; color:var(--ink-2); margin:0}
  .links{display:flex; flex-wrap:wrap; gap:10px; margin:22px 0 30px}
  .btn{display:inline-flex; align-items:center; gap:6px; padding:11px 18px; border-radius:10px; font-weight:700; font-size:14px; text-decoration:none; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
  .btn--main{background:var(--accent); border-color:var(--accent); color:#fff}
  @media (prefers-color-scheme:dark){ .btn--main{color:#0F131A} }
  .btn:hover{border-color:var(--accent)}
  .cta{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px}
  .cta h2{font-size:15px; font-weight:800; margin:0 0 6px}
  .cta p{font-size:13.5px}
  .cta .links{margin:12px 0 0}
  footer{border-top:1px solid var(--line); background:var(--surface); padding:24px 0 60px; font-size:12.5px; color:var(--ink-3)}
  footer div{max-width:820px; margin:0 auto; padding:0 24px}
  @media (max-width:560px){
    .topbar__inner, main, footer div{padding-left:16px; padding-right:16px}
    .btn{flex:1 1 100%; justify-content:center}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar__inner">
    <strong><a href="/">エージェントベストジョブ転職</a></strong>
    <a href="/">求人検索 &rarr;</a>
  </div>
</header>

<main>
  <p class="code">404 NOT FOUND</p>
  <h1 id="h">お探しのページが見つかりません</h1>
  <p id="lead">URLが変わったか、ページが削除された可能性があります。求人検索からお探しください。</p>
  <div id="closed" class="closed" hidden>
    <p class="closed__label">掲載終了</p>
    <p class="closed__title" id="cTitle"></p>
    <p class="closed__co" id="cCo"></p>
  </div>
  <div class="links" id="links">
    <a class="btn btn--main" href="/">求人を検索する</a>
    <a class="btn" href="/company/">企業から探す</a>
  </div>
  <div class="cta">
    <h2>掲載していない非公開求人もあります</h2>
    <p>重要なポジションほど公開されず、非公開で動いています。希望を送っていただければ、掲載外の求人も含めて個別にお探しします。ご利用は無料です。</p>
    <div class="links">
      <a class="btn btn--main" href="/apply.html" data-apply="">転職支援に申し込む（無料）</a>
      <a class="btn" href="https://calendly.com/r_matsuoka" target="_blank" rel="noopener">まず話だけ聞いてみる</a>
    </div>
  </div>
</main>

<footer>
  <div>&copy; 株式会社エージェントベスト ｜ 有料職業紹介事業 13-ユ-316964</div>
</footer>

<script>
(function(){
  var path = location.pathname;
  var m = path.match(/^\/job\/(rec[A-Za-z0-9]+)\/?/);
  function track(closed){ try{ gtag('event', 'page_404', { path: path, closed_job: closed ? 'yes' : 'no' }); }catch(e){} }
  function btn(href, label, main){
    var a = document.createElement('a');
    a.className = 'btn' + (main ? ' btn--main' : ''); a.href = href; a.textContent = label;
    return a;
  }
  if(!m){
    if(/^\/company\//.test(path)){
      document.getElementById('h').textContent = 'この企業ページは見つかりません';
      document.getElementById('lead').textContent = '企業ページのURLが変わった可能性があります。企業一覧からお探しください。';
    }
    track(false); return;
  }
  document.getElementById('h').textContent = 'この求人の掲載は終了しました';
  document.getElementById('lead').textContent = '募集が終了したか、掲載を取り下げた求人です。同じ企業・近い条件の求人をご覧ください。';
  /* jobs／skill の振り分けで相手のサイトに移った求人は、そちらの求人ページへ転送する（data/moved.json は rebuild.js の splitSite() が書く）。
     ⚠ 相手のサイトの 404.html では OTHER_ORIGIN が逆になる（jobs ⇔ skill）。 */
  var OTHER_ORIGIN = 'https://skill.agent-best.net';
  fetch('/data/moved.json', { cache: 'no-cache' }).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }).then(function(moved){
    if(moved.indexOf(m[1]) >= 0){
      try{ gtag('event', 'page_404', { path: path, closed_job: 'moved' }); }catch(e){}
      location.replace(OTHER_ORIGIN + '/job/' + m[1] + '/' + location.search);
      return;
    }
    showClosed();
  });
  function showClosed(){
  fetch('/data/closed-jobs.json', { cache: 'no-cache' }).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; }).then(function(closed){
    var v = closed[m[1]];
    track(!!v);
    if(!v) return;
    var title = v[0], co = v[1], cid = v[2];
    document.getElementById('cTitle').textContent = title;
    document.getElementById('cCo').textContent = co;
    document.getElementById('closed').hidden = false;
    document.title = '掲載終了：' + title + (co ? '｜' + co : '') + ' — エージェントベストジョブ転職';
    var links = document.getElementById('links');
    links.innerHTML = '';
    if(cid) links.appendChild(btn('/company/' + encodeURIComponent(cid) + '/', co + 'の募集中の求人を見る', true));
    else if(co) links.appendChild(btn('/?q=' + encodeURIComponent(co), co + 'の求人を検索する', true));
    links.appendChild(btn('/', '求人を検索する', !cid && !co));
  });
  }
})();
</script>
</body>
</html>
